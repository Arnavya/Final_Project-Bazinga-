apiVersion: v1
kind: ConfigMap
metadata:
  name: reasoning-engine-config
data:
  # groq + no key in the Secret => the engine runs as the offline stub.
  LLM_PROVIDER: "groq"
  LLM_BASE_URL: "https://api.groq.com/openai/v1"
  LLM_MODEL: "llama-3.3-70b-versatile"
  LLM_SMALL_MODEL: "llama-3.1-8b-instant"
  LLM_TIMEOUT: "30"
  # Must match the embedder the image's stores were built with.
  EMBEDDING_MODEL: "hashing"
  STORES_DIR: "/app/stores"
  LOG_FORMAT: "json"
  LOG_LEVEL: "INFO"
